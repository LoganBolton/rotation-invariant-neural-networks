[project]
name = "rotation-invariant-neural-networks"
version = "0.1.0"
description = "Moment-invariant tools and geometric neural network benchmarks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hippynn",
    "matplotlib",
    "networkx",
    "numpy",
    "plotly",
    "torch>2.0",
]

[tool.uv]
package = false

[tool.uv.sources]
hippynn = { path = "external/hippynn", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = [
    ".git",
    ".venv",
    "external",
    "vendor",
    "build",
    "dist",
]