[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rotation-invariant-neural-networks"
version = "0.1.0"
description = "Moment-invariant tools and geometric neural network benchmarks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hippynn",
    "matplotlib",
    "networkx",
    "numpy",
    "plotly",
    "torch>2.0",
]

[tool.uv.sources]
hippynn = { git = "https://github.com/LoganBolton/hippynn.git", rev = "009d62f55f5e4d919399d31711736f7d7e2f737c" }

[tool.setuptools.packages.find]
include = [
    "moment_invariant_tools*",
    "benchmarks*",
]
exclude = [
    "benchmarks.*.results*",
    "benchmarks.visualizations*",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = [
    ".git",
    ".venv",
    "external",
    "vendor",
    "build",
    "dist",
]
